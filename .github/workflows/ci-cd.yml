# GitHub Actions CI/CD Pipeline
# Tests, Docker image builds and security scanning for LLM infrastructure.
# Images are built to check the Dockerfiles but not pushed: there is no
# cluster to deploy them to (scripts/deploy.py and charts/ remain for that).

name: LLM Infrastructure CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.10'

jobs:
  # ==========================================================================
  # Code Quality & Linting
  # ==========================================================================
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 2
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.host-check.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.host-check.txt

      - name: Set up Helm
        uses: azure/setup-helm@v4
      
      - name: Run serving compile smoke
        run: |
          PYTHONPATH=src python -m py_compile \
            src/api/gateway.py \
            src/api/model_routing.py \
            src/monitoring/metrics.py \
            src/serving/mock_server.py \
            src/serving/vllm_server.py \
            scripts/awq_handoff.py \
            scripts/auth_smoke.py \
            scripts/check_serving_runtime_matrix.py \
            scripts/completion_smoke.py \
            scripts/compose_smoke_test.py \
            scripts/deploy.py \
            scripts/eval_gate.py \
            scripts/vllm_awq_smoke.py

      - name: Check serving runtime matrix
        run: python scripts/check_serving_runtime_matrix.py

      - name: Validate serving configuration files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          import yaml

          json_paths = [
              Path("config/eval_gate.json"),
              Path("config/eval_gate.production.json"),
              Path("config/model_routing.gpu.json"),
              Path("config/model_routing.local.json"),
          ]
          yaml_paths = [
              Path("charts/vllm-inference/Chart.yaml"),
              Path("charts/vllm-inference/values.yaml"),
              Path("charts/vllm-inference/values-staging.yaml"),
              Path("charts/vllm-inference/values-production.yaml"),
              Path("charts/vllm-inference/values-canary.yaml"),
              *Path("config").glob("*.yaml"),
              *Path("docker").glob("*.yml"),
              *Path("k8s").glob("**/*.yml"),
              *Path("k8s").glob("**/*.yaml"),
              Path("docker-compose.yml"),
              Path("docker-compose.local.yml"),
              Path("docker-compose.gpu.yml"),
          ]

          for path in json_paths:
              with path.open("r", encoding="utf-8") as handle:
                  json.load(handle)

          for path in yaml_paths:
              with path.open("r", encoding="utf-8") as handle:
                  list(yaml.safe_load_all(handle))

          print("serving-config-parse-ok")
          PY

      - name: Validate Helm chart
        run: |
          helm lint charts/vllm-inference
          helm template vllm-inference charts/vllm-inference --namespace llm-inference > /tmp/vllm-rendered.yaml
          helm template vllm-inference charts/vllm-inference \
            --namespace llm-inference \
            -f charts/vllm-inference/values-staging.yaml > /tmp/vllm-rendered-staging.yaml
          helm template vllm-inference charts/vllm-inference \
            --namespace llm-inference \
            -f charts/vllm-inference/values-production.yaml > /tmp/vllm-rendered-production.yaml
          helm template vllm-inference-canary charts/vllm-inference \
            --namespace llm-inference \
            -f charts/vllm-inference/values-production.yaml \
            -f charts/vllm-inference/values-canary.yaml > /tmp/vllm-rendered-canary.yaml
          helm template vllm-inference charts/vllm-inference \
            --namespace llm-inference \
            --set hpa.enabled=false \
            --set keda.enabled=true > /tmp/vllm-rendered-keda.yaml
          helm template vllm-inference charts/vllm-inference \
            --namespace llm-inference \
            --set serviceMonitor.enabled=false \
            --set persistence.enabled=false \
            --set image.tag=test \
            --set model.name=hf/example \
            --set-string 'resources.requests.nvidia\.com/gpu=2' \
            --set-string 'resources.limits.nvidia\.com/gpu=2' > /tmp/vllm-rendered-toggle.yaml
          python - <<'PY'
          from pathlib import Path

          import yaml

          def load_render(path):
              with Path(path).open("r", encoding="utf-8") as handle:
                  return [doc for doc in yaml.safe_load_all(handle) if doc]

          default_docs = load_render("/tmp/vllm-rendered.yaml")
          default_kinds = {doc["kind"] for doc in default_docs}
          assert "Deployment" in default_kinds
          assert "HorizontalPodAutoscaler" in default_kinds
          assert "PersistentVolumeClaim" in default_kinds
          assert "PodDisruptionBudget" in default_kinds
          assert "NetworkPolicy" in default_kinds
          assert "ServiceMonitor" in default_kinds
          assert "ScaledObject" not in default_kinds

          keda_kinds = {doc["kind"] for doc in load_render("/tmp/vllm-rendered-keda.yaml")}
          assert "ScaledObject" in keda_kinds
          assert "HorizontalPodAutoscaler" not in keda_kinds

          toggle_kinds = {doc["kind"] for doc in load_render("/tmp/vllm-rendered-toggle.yaml")}
          assert "ServiceMonitor" not in toggle_kinds
          assert "PersistentVolumeClaim" not in toggle_kinds

          for rendered in ("/tmp/vllm-rendered-staging.yaml", "/tmp/vllm-rendered-production.yaml"):
              gateway_config = next(
                  doc for doc in load_render(rendered)
                  if doc["kind"] == "ConfigMap" and doc["metadata"]["name"] == "api-gateway-config"
              )
              assert gateway_config["data"]["CORS_ORIGINS"] != "*"
              assert gateway_config["data"]["ALLOWED_HOSTS"] != "*"
              assert gateway_config["data"]["REDIS_SSL"] == "true"
              kinds = {doc["kind"] for doc in load_render(rendered)}
              assert "ExternalSecret" in kinds
              assert "Certificate" in kinds

          canary_docs = load_render("/tmp/vllm-rendered-canary.yaml")
          canary_names = {(doc["kind"], doc["metadata"]["name"]) for doc in canary_docs}
          assert ("Deployment", "vllm-server-canary") in canary_names
          assert ("Service", "vllm-service-canary") in canary_names
          assert ("Deployment", "api-gateway") not in canary_names

          print("helm-chart-render-ok")
          PY

      - name: Check whitespace errors
        run: git diff --check HEAD^ HEAD

  # ==========================================================================
  # Unit Tests
  # ==========================================================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.host-check.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.host-check.txt

      # No torch here: torch-dependent modules skip via pytest.importorskip and
      # run in the training-cpu job instead.
      - name: Run pytest
        run: python -m pytest tests/ -q -rs

      - name: Run host checks
        run: |
          chmod +x scripts/run_host_checks.sh
          scripts/run_host_checks.sh

  # ==========================================================================
  # Training Tests (CPU)
  # ==========================================================================
  training-cpu:
    name: Training Tests (CPU)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.training-ci.txt

      - name: Check training CI pins match requirements.txt
        run: |
          python - <<'PY'
          from pathlib import Path

          def pins(path):
              result = {}
              for line in Path(path).read_text().splitlines():
                  line = line.split("#", 1)[0].strip()
                  if "==" in line:
                      name, version = line.split("==", 1)
                      result[name.split("[")[0].strip().lower()] = version.strip()
              return result

          full = pins("requirements.txt")
          ci = pins("requirements.training-ci.txt")
          mismatched = {name: (version, full.get(name)) for name, version in ci.items() if full.get(name) != version}
          assert not mismatched, f"requirements.training-ci.txt drifted from requirements.txt: {mismatched}"
          print("training-ci-pins-ok")
          PY

      - name: Install CPU torch and training dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "$(grep '^torch==' requirements.training-ci.txt)"
          pip install -r requirements.training-ci.txt

      - name: Run training tests (no skips allowed)
        shell: bash
        run: |
          python -m pytest -q -rs \
            tests/unit/test_training_real_smoke.py \
            tests/unit/test_training_chat_format.py \
            tests/unit/test_training_hf_config.py \
            tests/unit/test_training_core_contracts.py \
            tests/unit/test_training_lifecycle_wiring.py \
            tests/unit/test_training_distributed.py \
            tests/unit/test_training_pipeline.py \
            tests/unit/test_verl_scripts.py \
            tests/unit/test_verl_backend.py | tee pytest-training.log
          if grep -q '^SKIPPED' pytest-training.log; then
            echo "::error::Training tests skipped; the real-Trainer smoke tests must run in this job"
            exit 1
          fi

  # ==========================================================================
  # Docker Build
  # ==========================================================================
  # The CUDA images take 15-35 min each. A pull request rebuilds only the images
  # whose Dockerfile or docker/requirements.<image>.txt changed (base copies no
  # repo files; the others copy src/ and config/, which cannot break the build).
  # Pushes to main and manual runs build all of them.
  docker-changes:
    name: Select Docker Images
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.select.outputs.images }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Select images to build
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          images=(base serving gateway mock-serving)
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            changed="$(git diff --name-only "${BASE_SHA}" "${GITHUB_SHA}")"
            selected=()
            for image in "${images[@]}"; do
              if grep -qxE "docker/(Dockerfile\.${image}|requirements\.${image}\.txt)" <<< "${changed}"; then
                selected+=("${image}")
              fi
            done
            images=("${selected[@]}")
          fi
          json="$(printf '%s\n' "${images[@]}" | python3 -c 'import json, sys; print(json.dumps([l for l in sys.stdin.read().split() if l]))')"
          echo "Images to build: ${json}"
          echo "images=${json}" >> "${GITHUB_OUTPUT}"

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint, test, training-cpu, docker-changes]
    if: needs.docker-changes.outputs.images != '[]'
    
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.docker-changes.outputs.images) }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.image }}
          push: false
          tags: llm-infrastructure-${{ matrix.image }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================================================
  # Security Scanning
  # ==========================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # upload-sarif; without it main fails "Resource not accessible"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  # ==========================================================================
  # Cleanup
  # ==========================================================================
  cleanup:
    name: Cleanup Old Artifacts
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 30
          keep_minimum_runs: 10
