{{- if and .Values.gateway.enabled .Values.gateway.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Values.resourceNames.gatewayHpa }}
  namespace: {{ include "vllm-inference.namespace" . }}
  labels:
{{ include "vllm-inference.gatewayLabels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.resourceNames.gatewayDeployment }}
  minReplicas: {{ .Values.gateway.hpa.minReplicas }}
  maxReplicas: {{ .Values.gateway.hpa.maxReplicas }}
  metrics:
{{ toYaml .Values.gateway.hpa.metrics | nindent 4 }}
{{- with .Values.gateway.hpa.behavior }}
  behavior:
{{ toYaml . | nindent 4 }}
{{- end }}
{{- end }}
