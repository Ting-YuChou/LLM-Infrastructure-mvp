{{- if and .Values.gateway.enabled .Values.gateway.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.resourceNames.gatewayIngress }}
  namespace: {{ include "vllm-inference.namespace" . }}
  labels:
{{ include "vllm-inference.gatewayLabels" . | nindent 4 }}
{{- with .Values.gateway.ingress.annotations }}
  annotations:
{{ toYaml . | nindent 4 }}
{{- end }}
spec:
{{- if .Values.gateway.ingress.className }}
  ingressClassName: {{ .Values.gateway.ingress.className }}
{{- end }}
{{- with .Values.gateway.ingress.tls }}
  tls:
{{ toYaml . | nindent 4 }}
{{- end }}
  rules:
{{- range .Values.gateway.ingress.hosts }}
    - http:
        paths:
{{- range .paths }}
          - path: {{ .path | quote }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ $.Values.resourceNames.gatewayService }}
                port:
                  number: {{ $.Values.gateway.service.port }}
{{- end }}
{{- if .host }}
      host: {{ .host | quote }}
{{- end }}
{{- end }}
{{- end }}
