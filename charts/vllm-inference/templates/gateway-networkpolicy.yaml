{{- if and .Values.gateway.enabled .Values.gateway.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.resourceNames.gatewayNetworkPolicy }}
  namespace: {{ include "vllm-inference.namespace" . }}
  labels:
{{ include "vllm-inference.gatewayLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
{{ include "vllm-inference.gatewaySelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
{{ toYaml .Values.gateway.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.gateway.service.targetPort }}
  egress:
    - to:
        - podSelector:
            matchLabels:
{{ include "vllm-inference.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
{{- if .Values.redis.enabled }}
    - to:
        - podSelector:
            matchLabels:
{{ include "vllm-inference.redisSelectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.redis.service.targetPort }}
{{- else }}
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.redis.service.port }}
{{- end }}
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- with .Values.gateway.networkPolicy.additionalEgress }}
{{ toYaml . | nindent 4 }}
{{- end }}
{{- end }}
