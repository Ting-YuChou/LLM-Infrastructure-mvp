{{- if and .Values.gateway.enabled .Values.gateway.ingress.enabled .Values.gateway.ingress.certManager.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.resourceNames.gatewayCertificate }}
  namespace: {{ include "vllm-inference.namespace" . }}
  labels:
{{ include "vllm-inference.gatewayLabels" . | nindent 4 }}
spec:
  secretName: {{ (index .Values.gateway.ingress.tls 0).secretName | quote }}
  issuerRef:
{{ toYaml .Values.gateway.ingress.certManager.issuerRef | nindent 4 }}
  dnsNames:
{{- range .Values.gateway.ingress.hosts }}
    - {{ .host | quote }}
{{- end }}
{{- end }}
