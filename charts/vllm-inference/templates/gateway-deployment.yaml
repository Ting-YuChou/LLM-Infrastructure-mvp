{{- if .Values.gateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.resourceNames.gatewayDeployment }}
  namespace: {{ include "vllm-inference.namespace" . }}
  labels:
{{ include "vllm-inference.gatewayLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
{{ include "vllm-inference.gatewaySelectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
{{ include "vllm-inference.gatewaySelectorLabels" . | nindent 8 }}
{{- with .Values.gateway.podLabels }}
{{ toYaml . | nindent 8 }}
{{- end }}
{{- with .Values.gateway.podAnnotations }}
      annotations:
{{ toYaml . | nindent 8 }}
{{- end }}
    spec:
      containers:
        - name: api-gateway
          image: {{ include "vllm-inference.gatewayImage" . }}
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ .Values.resourceNames.gatewayConfigMap }}
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gateway.auth.existingSecret }}
                  key: {{ .Values.gateway.auth.jwtSecretKey }}
            - name: AUTH_USERS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gateway.auth.existingSecret }}
                  key: {{ .Values.gateway.auth.authUsersKey }}
{{- with .Values.gateway.extraEnv }}
{{ toYaml . | nindent 12 }}
{{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.gateway.service.targetPort }}
              protocol: TCP
          resources:
{{ toYaml .Values.gateway.resources | nindent 12 }}
{{- with .Values.gateway.probes.liveness }}
          livenessProbe:
{{ toYaml . | nindent 12 }}
{{- end }}
{{- with .Values.gateway.probes.readiness }}
          readinessProbe:
{{ toYaml . | nindent 12 }}
{{- end }}
{{- with .Values.gateway.probes.startup }}
          startupProbe:
{{ toYaml . | nindent 12 }}
{{- end }}
          volumeMounts:
            - name: gateway-routing
              mountPath: /workspace/config
              readOnly: true
{{- with .Values.gateway.extraVolumeMounts }}
{{ toYaml . | nindent 12 }}
{{- end }}
      volumes:
        - name: gateway-routing
          configMap:
            name: {{ .Values.resourceNames.gatewayRoutingConfigMap }}
{{- with .Values.gateway.extraVolumes }}
{{ toYaml . | nindent 8 }}
{{- end }}
{{- end }}
