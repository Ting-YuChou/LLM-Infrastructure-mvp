{{- if and .Values.gateway.enabled .Values.gateway.auth.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.resourceNames.gatewayExternalSecret }}
  namespace: {{ include "vllm-inference.namespace" . }}
  labels:
{{ include "vllm-inference.gatewayLabels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.gateway.auth.externalSecret.refreshInterval | quote }}
  secretStoreRef:
{{ toYaml .Values.gateway.auth.externalSecret.secretStoreRef | nindent 4 }}
  target:
    name: {{ .Values.gateway.auth.existingSecret }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.gateway.auth.jwtSecretKey }}
      remoteRef:
{{ toYaml .Values.gateway.auth.externalSecret.remoteRefs.jwtSecret | nindent 8 }}
    - secretKey: {{ .Values.gateway.auth.authUsersKey }}
      remoteRef:
{{ toYaml .Values.gateway.auth.externalSecret.remoteRefs.authUsers | nindent 8 }}
{{- if .Values.gateway.auth.externalSecret.remoteRefs.redisPassword.key }}
    - secretKey: {{ .Values.redis.auth.passwordKey }}
      remoteRef:
{{ toYaml .Values.gateway.auth.externalSecret.remoteRefs.redisPassword | nindent 8 }}
{{- end }}
{{- end }}
