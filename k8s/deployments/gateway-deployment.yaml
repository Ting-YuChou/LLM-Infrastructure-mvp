# Kubernetes reference manifests for the API gateway serving entrypoint.
# Create the gateway-auth Secret before applying:
#   kubectl create secret generic gateway-auth -n llm-inference \
#     --from-literal=JWT_SECRET='change-me' \
#     --from-literal=AUTH_USERS='local:local'

apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: llm-inference
  labels:
    app: api-gateway
    version: v1
data:
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_REQUESTS_PER_MINUTE: "60"
  RATE_LIMIT_REQUESTS_PER_HOUR: "1000"
  RATE_LIMIT_TOKENS_PER_MINUTE: "100000"
  RATE_LIMIT_TOKENS_PER_HOUR: "1000000"
  REDIS_HOST: "redis.llm-inference.svc.cluster.local"
  REDIS_PORT: "6379"
  VLLM_BACKEND_URL: "http://vllm-service:80"
  DEFAULT_COMPLETION_MODEL: "/workspace/models/awq/checkpoint-final"
  MODEL_ROUTING_CONFIG: "/workspace/config/model_routing.k8s.json"
  ROUTING_CANARY_SALT: "k8s"
  CORS_ORIGINS: "*"
  ALLOWED_HOSTS: "*"

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-routing
  namespace: llm-inference
  labels:
    app: api-gateway
    version: v1
data:
  model_routing.k8s.json: |
    {
      "default_model": "/workspace/models/awq/checkpoint-final",
      "allow_passthrough": false,
      "routes": {
        "/workspace/models/awq/checkpoint-final": {
          "description": "Kubernetes stable route through the internal vLLM service.",
          "targets": [
            {
              "name": "stable",
              "backend_url": "http://vllm-service:80",
              "model": "/workspace/models/awq/checkpoint-final",
              "weight": 100,
              "stage": "Production",
              "version": "stable"
            }
          ]
        }
      }
    }

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: llm-inference
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - name: redis
          containerPort: 6379
          protocol: TCP
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 10
          periodSeconds: 20
        readinessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 5
          periodSeconds: 10

---

apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: llm-inference
  labels:
    app: redis
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
    protocol: TCP

---

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-pdb
  namespace: llm-inference
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: redis

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: llm-inference
  labels:
    app: api-gateway
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
      version: v1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: api-gateway
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: api-gateway
        image: llm-gateway:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: api-gateway-config
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: gateway-auth
              key: JWT_SECRET
        - name: AUTH_USERS
          valueFrom:
            secretKeyRef:
              name: gateway-auth
              key: AUTH_USERS
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 12
        volumeMounts:
        - name: gateway-routing
          mountPath: /workspace/config
          readOnly: true
      volumes:
      - name: gateway-routing
        configMap:
          name: api-gateway-routing

---

apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: llm-inference
  labels:
    app: api-gateway
    version: v1
spec:
  type: ClusterIP
  selector:
    app: api-gateway
    version: v1
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway
  namespace: llm-inference
  labels:
    app: api-gateway
    version: v1
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 8080

---

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-pdb
  namespace: llm-inference
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api-gateway
      version: v1

---

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: llm-inference
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

---

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-gateway-network-policy
  namespace: llm-inference
spec:
  podSelector:
    matchLabels:
      app: api-gateway
      version: v1
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: vllm
          version: v1
    ports:
    - protocol: TCP
      port: 8000
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53

---

apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: api-gateway-metrics
  namespace: llm-inference
  labels:
    app: api-gateway
    version: v1
spec:
  selector:
    matchLabels:
      app: api-gateway
  endpoints:
  - port: http
    interval: 30s
    path: /metrics
