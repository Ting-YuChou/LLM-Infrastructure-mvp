# nano-vLLM v0.1 configuration
# Educational single-model backend for learning KV cache, decode loops, and kernels.

model:
  # Must point to a HuggingFace Llama-family checkpoint already present on disk.
  name: "/workspace/models/nano/checkpoint-final"
  served_model_name: "nano-llm-local"
  tokenizer: null
  trust_remote_code: false
  dtype: "float16"
  max_model_len: 2048

engine:
  # "auto" uses CUDA when available and CPU otherwise. Triton fast paths only
  # run when CUDA + triton are available; PyTorch fallbacks are always available.
  device: "auto"
  # "triton": paged attention and fused RoPE + KV write kernels (Phase 1);
  # "torch": the PyTorch references.
  attention_backend: "triton"
  # "triton" / "cuda" use a GEMV kernel for linear layers at <= 16 / 2 rows
  # (decode); "cuda" JIT-builds it and needs nvcc matching torch's CUDA.
  linear_backend: "triton"
  # "awq": the model is an AWQ checkpoint (AutoAWQ GEMM format, 4-bit, groups
  # of 128, zero points), e.g. hugging-quants/Meta-Llama-3.1-8B-Instruct-AWQ-INT4;
  # an AWQ checkpoint loads as "awq" under "none" too. "w4a16" quantizes a
  # full-precision model's decoder-layer projections to 4-bit at load
  # (round-to-nearest, symmetric, groups of 128; lower quality than AWQ).
  # Either way about 4x less weight memory and traffic, run by the
  # Marlin-style gemm_w4a16_tiled kernel.
  weight_quant: "none"
  # "int8": lm_head as int8 with one scale per vocab row, half its bytes;
  # "int8_dense": int8 up to 64 rows and the bf16 weight past that (both kept);
  # "auto": int8_dense under w4a16 / awq, none otherwise (model.AUTO_LM_HEAD_QUANT).
  lm_head_quant: "auto"
  # "fp8": the paged KV cache holds e4m3 codes plus one fp32 scale per
  # (token, kv head): about half the KV bytes, so about twice the tokens.
  kv_cache_dtype: "auto"
  use_triton: true
  # CUDA graphs for decode steps up to cuda_graph_max_bs sequences, and
  # piecewise graphs (attention eager in between) for other steps up to
  # cuda_graph_max_tokens tokens (0: off).
  enforce_eager: false
  cuda_graph_max_bs: 64
  cuda_graph_max_tokens: 512
  # Launch step N+1 before collecting step N: scheduling overlaps the GPU,
  # finish checks lag one step.
  async_scheduling: true
  # Seeds the sampler: each draw comes from (seed, sequence id, position).
  seed: 0
  # Engine core (scheduler + model) in its own process; this one keeps
  # tokenization, detokenization and HTTP off the model steps' GIL.
  multiprocess: false
  eager_load: true
  max_new_tokens: 256
  kvcache_block_size: 16
  # 0 sizes the paged KV cache from gpu_memory_utilization after loading the
  # weights and profiling one max_num_batched_tokens forward (CPU: 1024).
  num_kvcache_blocks: 0
  gpu_memory_utilization: 0.9
  max_num_seqs: 16
  max_num_batched_tokens: 512
  # "mixed": decodes and prefill chunks share each step's token budget
  # (chunked prefill); "prefill_first": prefill steps stall the decodes.
  scheduling: "mixed"
  enable_prefix_cache: true
  # "python" or "cpp": the radix tree and block allocator in C++ (nanobind;
  # needs `pip install nanobind` and a C++ compiler, built on first use).
  prefix_cache_backend: "python"

server:
  host: "0.0.0.0"
  port: 8000
  max_concurrent_requests: 16

monitoring:
  enable_metrics: true
