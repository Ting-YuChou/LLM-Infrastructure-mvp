# Supervised Fine-Tuning (SFT) Configuration
# This config defines parameters for instruction fine-tuning

# ============================================================================
# Model Configuration
# ============================================================================
model:
  # Base model to fine-tune (HuggingFace model ID or local path)
  # Gated repo: export HF_TOKEN after accepting the Meta license on Hugging Face.
  name: "meta-llama/Meta-Llama-3-8B"
  
  # Local cache directory for downloaded models
  cache_dir: "/workspace/models/base"
  
  # Mixed precision (bf16, fp16, fp32). This is the only precision switch:
  # it sets the load dtype and Trainer bf16/fp16 flags. Llama 3 is trained in
  # bf16; fp16 full fine-tuning loads fp32 master weights (GradScaler requires it).
  precision: "bf16"
  
  # Enable gradient checkpointing (saves memory at cost of compute)
  gradient_checkpointing: true
  
  # Flash Attention 2 for faster training (requires flash-attn package)
  use_flash_attention: true

# ============================================================================
# Data Configuration
# ============================================================================
data:
  # Training dataset path (JSON/JSONL format)
  train_file: "/workspace/data/sft/train.json"
  
  # Validation dataset path
  val_file: "/workspace/data/sft/val.json"
  
  # Maximum tokens per example, rendered with the Llama 3 chat template
  # (src/training/chat_format.py) that RM, PPO and serving reuse. Longer
  # conversations are cut after the last assistant reply that fits; examples
  # whose prompt alone fills max_length are dropped. Batches are padded to
  # their longest row, not to max_length.
  max_length: 2048
  
  # Expected JSON format, either per row:
  # {"prompt": "instruction here", "completion": "expected response"}
  # {"messages": [{"role": "system", "content": "..."},     # optional
  #               {"role": "user", "content": "..."},
  #               {"role": "assistant", "content": "..."}, ...]}   # ends with assistant
  # Every assistant reply in a conversation is trained on.
  prompt_key: "prompt"
  completion_key: "completion"
  
  # Data preprocessing
  num_proc: 8  # Number of CPU processes for data loading
  streaming: false  # Set true for very large datasets

# ============================================================================
# Training Configuration
# ============================================================================
training:
  # Output directory for checkpoints and logs
  output_dir: "/workspace/models/sft"
  
  # Number of training epochs
  num_train_epochs: 3
  
  # Batch sizes (adjust based on GPU memory)
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  
  # Gradient accumulation steps. Global batch = per_device * grad_accum * GPUs:
  # 4 * 1 * 8 GPUs = 32. On a single GPU set this to 8 for the same batch.
  gradient_accumulation_steps: 1
  
  # Learning rate and scheduler
  learning_rate: 2.0e-5
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03  # Warmup for first 3% of steps
  
  # Optimizer settings
  optimizer: "adamw_torch"
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0  # Gradient clipping
  
  # Logging and evaluation
  logging_steps: 10
  eval_steps: 500
  save_steps: 500
  
  # Checkpoint management
  save_total_limit: 3  # Keep only last 3 checkpoints
  save_strategy: "steps"
  eval_strategy: "steps"
  
  # Performance optimization
  dataloader_num_workers: 4
  dataloader_pin_memory: true
  
  # Resume from checkpoint (set path if resuming)
  resume_from_checkpoint: null

# ============================================================================
# LoRA (Low-Rank Adaptation) Configuration - Optional
# Enable for parameter-efficient fine-tuning
# ============================================================================
lora:
  # Set true to use LoRA instead of full fine-tuning; with LoRA prefer
  # distributed.strategy: ddp (the frozen bf16 base fits on every GPU).
  enabled: false
  
  # LoRA hyperparameters
  r: 16  # LoRA rank
  alpha: 32  # LoRA scaling
  dropout: 0.05
  
  # Modules to apply LoRA (typical for LLaMA)
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  
  # LoRA bias settings
  bias: "none"  # Options: none, all, lora_only

  # Llama 3 base never trained the <|start_header_id|>/<|eot_id|> embeddings
  # the chat template uses, so LoRA runs also train embeddings and lm_head
  # (full copies: ~2 GB extra in the adapter). Full fine-tuning covers them already.
  modules_to_save:
    - "embed_tokens"
    - "lm_head"

# ============================================================================
# Distributed Training
# Launch with: torchrun --standalone --nproc_per_node 8 ... (or
# scripts/launch_training.sh). A single process ignores this section.
# ============================================================================
distributed:
  # none | ddp | fsdp. FSDP shards parameters, gradients and optimizer state
  # across GPUs (needed for full fine-tuning 8B); ddp replicates the model and
  # suits LoRA runs.
  strategy: "fsdp"
  timeout_minutes: 60
  find_unused_parameters: false
  fsdp:
    version: 1  # FSDP2 is not selectable through transformers 4.57 TrainingArguments
    sharding: "full_shard"  # full_shard | shard_grad_op | hybrid_shard
    transformer_layer_cls_to_wrap: ["LlamaDecoderLayer"]
    # null follows model.gradient_checkpointing; FSDP checkpoints each wrapped layer.
    activation_checkpointing: null
    use_orig_params: true
    sync_module_states: true
    cpu_ram_efficient_loading: false
    limit_all_gathers: true
    backward_prefetch: "backward_pre"
    forward_prefetch: false
    offload: false
    # Intermediate checkpoints are sharded (resume needs the same GPU count); final/ is always a
    # full bf16 model written by rank 0.
    checkpoint_state_dict_type: "sharded"

# ============================================================================
# Experiment Tracking
# ============================================================================
tracking:
  # Enable Weights & Biases logging
  wandb_enabled: false  # Needs WANDB_API_KEY; MLflow is the default tracker
  wandb_project: "llm-sft-training"
  wandb_run_name: "llama3-8b-sft"
  
  # Enable TensorBoard logging
  tensorboard_enabled: true
  tensorboard_dir: "/workspace/outputs/tensorboard/sft"
  
  # Enable MLflow tracking
  mlflow_enabled: true
  mlflow_tracking_uri: "http://localhost:5000"
  mlflow_experiment_name: "sft-training"

# ============================================================================
# Model Registry
# ============================================================================
registry:
  # Auto-register best model to MLflow
  auto_register: true
  
  # Model name in registry
  model_name: "llama3-8b-sft"
  
  # Tags to add to registered model
  tags:
    task: "instruction-following"
    base_model: "llama3-8b"
    training_type: "sft"

# ============================================================================
# Evaluation Configuration
# ============================================================================
evaluation:
  # Metrics to compute during evaluation
  metrics:
    - "loss"
    - "perplexity"
  
  # Generate samples during evaluation
  generate_samples: true
  num_samples: 5
  
  # Generation parameters for sample outputs
  generation:
    max_new_tokens: 256
    temperature: 0.7
    top_p: 0.9
    do_sample: true

# ============================================================================
# Safety & Constraints
# ============================================================================
safety:
  # Maximum gradient norm (prevents exploding gradients)
  max_grad_norm: 1.0
  
  # Early stopping configuration
  early_stopping:
    enabled: true
    patience: 3  # Stop if no improvement for 3 evaluations
    metric: "eval_loss"
    mode: "min"  # Minimize loss
  
  # Memory limits
  max_memory_per_gpu: "80GB"  # For A100 GPUs
  
  # Timeout settings
  max_training_time_hours: 24  # Kill training after 24 hours

# ============================================================================
# Debugging & Development
# ============================================================================
debug:
  # Run in debug mode (reduced dataset, frequent logging)
  enabled: false
  
  # Use small subset of data for quick testing
  max_train_samples: 1000
  max_eval_samples: 100
  
  # Verbose logging
  verbose: true
  
  # Detect anomalies (performance cost)
  detect_anomaly: false
