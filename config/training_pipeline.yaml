# Aggregated training pipeline configuration.
# Entrypoint:
#   python scripts/train_pipeline.py --config config/training_pipeline.yaml --stages all
# ("all" is sft -> reward -> rlhf -> handoff; add dpo with --stages sft,dpo)

output_dir: "outputs/training_pipeline"

# Each training stage runs as its own torchrun job (one process per GPU) so GPU
# memory and FSDP state never carry over between stages. auto = torchrun when
# more than one GPU is visible, otherwise in this process. A stage can set its
# own nproc_per_node under stages.<name>.
distributed:
  launcher: "auto"  # auto | torchrun | inprocess
  nproc_per_node: "auto"  # auto = every visible GPU

stages:
  sft:
    config: "config/sft_config.yaml"
    output_dir: "outputs/training_pipeline/models/sft"
    use_lora: false

  reward:
    config: "config/reward_config.yaml"
    output_dir: "outputs/training_pipeline/models/reward"

  # Opt-in alternative to reward + PPO, trained from the SFT checkpoint:
  #   python scripts/train_pipeline.py --config config/training_pipeline.yaml --stages sft,dpo
  dpo:
    config: "config/dpo_config.yaml"
    output_dir: "outputs/training_pipeline/models/dpo"

  rlhf:
    config: "config/rlhf_config.yaml"
    output_dir: "outputs/training_pipeline/models/aligned"
    prompts_file: "/workspace/data/prompts/rl_prompts.json"
    # native: src/training/rlhf_trainer.py (LoRA + DDP, HF generate) under torchrun.
    # verl: verl_ppo/run_ppo.sh (Ray + vLLM rollouts + FSDP) in verl's own env from
    # verl_ppo/setup_env.sh; batch, lengths and steps come from rlhf_config.yaml.
    backend: native
    verl:
      mode: full  # full | lora (full was faster on 8B, see verl_ppo/README.md)
      dir: null   # verl checkout from setup_env.sh; defaults to $VERL_DIR

promotion:
  metrics_path: "outputs/training_pipeline/eval/training_candidate.json"
  gate_config: "config/eval_gate.training.json"

artifact:
  manifest_path: "outputs/training_pipeline/model_artifact_manifest.json"
  dataset_version: "local-dev"
  storage_uri: ""
  intended_use: "instruction-following text generation"
  limitations: "Run production eval_gate.production.json and AWQ load smoke before serving traffic."

awq:
  handoff_path: "outputs/training_pipeline/awq_handoff.json"
  conversion_command: ""

serving:
  handoff_path: "outputs/training_pipeline/serving_handoff.json"
  expected_awq_path: "/workspace/models/awq/checkpoint-final"
  quantization: "awq"
  dtype: "float16"
  config_file: "config/serving_config.yaml"
  docker_compose_service: "vllm-server"
  kubernetes_manifest: "k8s/deployments/vllm-deployment.yaml"
