# Reinforcement Learning from Human Feedback (RLHF) Configuration
# This config defines parameters for PPO alignment training.
# DPO is its own stage: config/dpo_config.yaml (src/training/dpo_trainer.py).

# ============================================================================
# Model Configuration
# ============================================================================
model:
  # Policy model (the model we're optimizing)
  policy:
    name: "/workspace/models/sft/final"  # SFT model path
    cache_dir: "/workspace/models/sft"
    precision: "bf16"  # Applies to policy, reference and reward models
    gradient_checkpointing: true
    use_flash_attention: true  # falls back to sdpa without flash-attn
  
  # Reference model for the KL penalty. With lora.enabled it is the policy with
  # its adapter disabled (no second copy is loaded); otherwise this path loads.
  reference:
    name: "/workspace/models/sft/final"  # Same as policy initially
    cache_dir: "/workspace/models/sft"
    frozen: true  # Don't update reference model
  
  # Reward model
  reward:
    name: "/workspace/models/reward/final"
    cache_dir: "/workspace/models/reward"
    frozen: true  # Reward model stays fixed
  
  # Not loaded: the value function is a linear head on the policy's last
  # hidden state (ValueHead), trained together with the policy.
  value:
    name: "/workspace/models/sft/final"  # Initialize from SFT
    cache_dir: "/workspace/models/sft"

# ============================================================================
# LoRA policy (required for distributed PPO)
# Each GPU holds the frozen bf16 policy + reward model (~32 GB) and DDP syncs
# only the adapter and value-head gradients. checkpoint-final is merged back
# into a full model for AWQ/vLLM.
# ============================================================================
lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.0  # must stay 0: dropout makes rollout and update log-probs differ
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  bias: "none"

# ============================================================================
# Distributed Training
# Launch with: torchrun --standalone --nproc_per_node 8 ... (or
# scripts/launch_training.sh rlhf). A single process ignores this section.
# ============================================================================
distributed:
  # none | ddp. Full-parameter PPO (lora.enabled: false) only runs single-process.
  strategy: "ddp"
  timeout_minutes: 60

# ============================================================================
# Data Configuration
# ============================================================================
data:
  # Prompts for RL training
  prompt_file: "/workspace/data/prompts/rl_prompts.json"
  
  # Expected JSON format:
  # {"prompt": "instruction/question here"}
  prompt_key: "prompt"
  
  # Number of prompts to sample per batch
  batch_size: 128
  
  # Maximum prompt length
  max_prompt_length: 512  # Chat-templated tokens; longer prompts are skipped
  
  # Maximum generation length (rollout time grows with it; HF generate, no vLLM)
  max_response_length: 512
  
  # Data loading
  num_proc: 8
  shuffle: true

# ============================================================================
# RLHF Algorithm Configuration
# ============================================================================
algorithm:
  # PPO is the only algorithm here; DPO runs from config/dpo_config.yaml.
  type: "ppo"
  
  # PPO-specific parameters
  ppo:
    # Passes over the prompt set (total_steps usually stops training first)
    num_epochs: 4

    # Optimizer passes over each rollout batch
    ppo_epochs: 4
    
    # Clip range for policy ratio
    clip_range: 0.2
    
    # Clip range for value function
    value_clip_range: 0.2
    
    # Coefficient for value loss
    value_loss_coef: 0.1
    
    # Entropy bonus coefficient (encourages exploration)
    entropy_coef: 0.01
    
    # GAE (Generalized Advantage Estimation) lambda
    gae_lambda: 0.95
    
    # Discount factor. 1.0: the reward model scores the whole response at its
    # last token, and discounting that pays shorter answers more per token.
    gamma: 1.0
    
    # Target KL divergence (from reference model)
    target_kl: 0.1
    
    # KL penalty coefficient (adaptive)
    kl_coef: 0.05
    init_kl_coef: 0.05
    
    # Mini-batch size for PPO updates
    mini_batch_size: 32


# ============================================================================
# Generation Configuration
# ============================================================================
generation:
  # Who samples the rollouts: "hf" (policy.generate()) or "vllm", a vLLM engine
  # colocated on each rank's GPU that gets base + LoRA delta copied into its
  # LoRA-targeted layers before every rollout (needs lora.enabled without
  # modules_to_save, and the vllm package; see training/vllm_rollout.py).
  engine: "hf"
  vllm:
    gpu_memory_utilization: 0.3  # of the GPU, for vLLM's weights and KV cache
    sleep_between_rollouts: true  # free that memory during the PPO update

  # Sampling parameters during RL rollouts
  temperature: 0.7
  top_p: 0.9
  top_k: 50
  
  # Do sampling (vs greedy decoding)
  do_sample: true
  
  # Number of sequences to generate per prompt
  num_return_sequences: 1
  
  # Repetition penalty
  repetition_penalty: 1.0
  
  # Length penalty
  length_penalty: 1.0
  
  # Early stopping
  early_stopping: false

# ============================================================================
# Training Configuration
# ============================================================================
training:
  # Output directory
  output_dir: "/workspace/models/aligned"
  
  # Total number of PPO steps (one rollout batch per step). Start short:
  # each step generates up to max_response_length tokens with HF generate.
  total_steps: 500
  
  # Learning rate for the policy (LoRA adapters; use ~1e-6 for full-parameter PPO)
  policy_learning_rate: 1.0e-5
  
  # Learning rate for value function
  value_learning_rate: 5.0e-5
  
  # Learning rate scheduler
  lr_scheduler_type: "cosine"
  warmup_steps: 100
  
  # Optimizer
  optimizer: "adamw"
  weight_decay: 0.01
  max_grad_norm: 1.0
  
  # Prompts per GPU per step: 8 x 8 GPUs = 64 rollouts per PPO step
  per_device_batch_size: 8
  
  # Gradient accumulation
  gradient_accumulation_steps: 8
  
  # Evaluation and logging. Reward, KL, response length and EOT rate are
  # logged every step; the PPO losses every logging_steps; num_samples decoded
  # rollouts every sample_steps (also appended to <output_dir>/samples.jsonl, 0 = off).
  logging_steps: 10
  sample_steps: 10
  num_samples: 2
  eval_steps: 100
  save_steps: 500
  
  # Checkpoint management
  save_total_limit: 3
  
  # Performance
  dataloader_num_workers: 4

# ============================================================================
# Reward Configuration
# ============================================================================
reward:
  # Reward normalization
  normalize_rewards: true
  
  # Reward clipping
  clip_rewards: true
  clip_range: [-10, 10]
  
  # Advantage normalization
  normalize_advantages: true
  
  # Reward shaping (optional additional rewards)
  length_penalty: 0.0  # Penalty/bonus per token
  
  # Safety rewards (optional)
  safety_reward_enabled: false
  safety_reward_weight: 0.1

# ============================================================================
# Verl-Specific Configuration
# ============================================================================
verl:
  # Ray configuration for distributed training
  ray:
    num_workers: 4  # Number of rollout workers
    num_gpus_per_worker: 0.25  # Fractional GPU allocation
    
  # Actor (policy) configuration
  actor:
    num_instances: 2
    gpus_per_instance: 1
  
  # Critic (value) configuration  
  critic:
    num_instances: 1
    gpus_per_instance: 1
  
  # Reward model serving
  reward_model:
    num_instances: 1
    gpus_per_instance: 1
  
  # vLLM configuration for generation
  vllm:
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.8
    max_num_batched_tokens: 8192

# ============================================================================
# Experiment Tracking
# ============================================================================
tracking:
  # Weights & Biases
  wandb_enabled: false  # Needs WANDB_API_KEY; MLflow is the default tracker
  wandb_project: "llm-rlhf-training"
  wandb_run_name: "llama3-8b-rlhf-ppo"
  
  # TensorBoard
  tensorboard_enabled: true
  tensorboard_dir: "/workspace/outputs/tensorboard/rlhf"
  
  # MLflow
  mlflow_enabled: true
  mlflow_tracking_uri: "http://localhost:5000"
  mlflow_experiment_name: "rlhf-training"
  
  # Additional metrics to track
  custom_metrics:
    - "reward/mean"
    - "reward/std"
    - "kl_divergence"
    - "policy_loss"
    - "value_loss"
    - "entropy"
    - "approx_kl"
    - "clipfrac"

# ============================================================================
# Model Registry
# ============================================================================
registry:
  auto_register: true
  model_name: "llama3-8b-rlhf"
  
  tags:
    task: "rlhf-alignment"
    base_model: "llama3-8b"
    algorithm: "ppo"
    training_type: "rlhf"

# ============================================================================
# Evaluation Configuration
# ============================================================================
evaluation:
  # Evaluation prompts
  eval_prompts_file: "/workspace/data/prompts/eval_prompts.json"
  
  # Number of prompts to evaluate
  num_eval_prompts: 100
  
  # Generation for evaluation
  eval_generation:
    temperature: 0.7
    top_p: 0.9
    max_new_tokens: 512
  
  # Compute metrics
  metrics:
    - "reward/mean"
    - "reward/std"
    - "response_length/mean"
    - "kl_divergence"
  
  # Human evaluation samples
  save_samples: true
  num_samples_to_save: 20

# ============================================================================
# Safety & Constraints
# ============================================================================
safety:
  # KL divergence constraints (prevent policy from drifting too far)
  max_kl_divergence: 0.5
  
  # Reward constraints
  max_reward_delta: 5.0  # Max change in reward per step
  
  # Early stopping
  early_stopping:
    enabled: true
    patience: 5
    metric: "reward/mean"
    mode: "max"
  
  # Safety filters (optional)
  content_filtering:
    enabled: false
    toxic_threshold: 0.5

# ============================================================================
# Debugging & Development
# ============================================================================
debug:
  enabled: false
  max_train_samples: 100
  max_eval_samples: 20
  verbose: true
  
  # Save intermediate outputs
  save_generations: true
  save_rewards: true
  
  # Gradient checking
  check_gradients: false

# ============================================================================
# Advanced Settings
# ============================================================================
advanced:
  # Reference model update frequency
  # Update reference model every N steps to prevent KL drift
  reference_update_freq: 0  # 0 = never update (standard)
  
  # Adaptive KL penalty
  adaptive_kl:
    enabled: true
    target_kl: 0.1
    kl_coef_min: 0.01
    kl_coef_max: 0.5
  
  # Experience replay
  experience_replay:
    enabled: false
    buffer_size: 10000
    
  # Curriculum learning
  curriculum:
    enabled: false
    start_difficulty: 0.3
    end_difficulty: 1.0
